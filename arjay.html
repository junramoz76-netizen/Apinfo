    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: url(bg_arjay.jpg) no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 40px;
            line-height: 1.6;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 40px;
            border-radius: 16px;
            backdrop-filter: blur(4px);
        }
        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.2);
            display: block;
            margin: 0 auto 25px;
        }
        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
            color: #ffffff;
        }
        h2 {
            font-size: 20px;
            margin: 25px 0 10px;
            color: #cccccc;
        }
        p {
            font-size: 16px;
            color: #eeeeee;
        }
        .hobbies-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .hobby-box {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 35px;
        }
        .social-icon {
            width: 50px;
            height: 50px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .social-icon:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            color: #aaaaaa;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .back-btn:hover {
            color: #ffffff;
        }
