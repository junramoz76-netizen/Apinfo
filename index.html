<!DOCTYPE html>
<html>
<head>
    <title>Choose Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: url(bg_main.jpg) no-repeat center center;
            background-size: contain;
            background-color: #000000;
            background-attachment: fixed;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 60px;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }
        .profile-link {
            font-size: 48px;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.3s;
        }
        .profile-link:hover {
            opacity: 0.7;
        }
        .arjay {
            color: #ffffff;
        }
        .jaime {
            color: #a5d6a7;
        }
    </style>
</head>
<body>
    <a href="arjay.html" class="profile-link arjay">ARJAY</a>
    <a href="jaime.html" class="profile-link jaime">JAIME</a>
</body>
</html>
